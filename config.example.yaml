# Copy to config.yaml and fill in.  ${VAR} is replaced by the environment
# variable VAR, so secrets can stay out of this file.

# Used to sign streamer links and sessions. Generate one with:
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
secret_key: ${GAC_SECRET_KEY}
# Password for /admin (any username works).
admin_password: ${GAC_ADMIN_PASSWORD}

database: gamersacoeur.sqlite3
host: 0.0.0.0
port: 8000

mail:
  # graph = Microsoft 365 / Outlook through Microsoft Graph. Needs an app
  #         registration in Entra ID (portal.azure.com) with the APPLICATION
  #         permission Mail.Read + admin consent, and a client secret.
  # imap  = Gmail (with an App Password), Infomaniak, ... (see below)
  provider: graph
  tenant_id: 00000000-0000-0000-0000-000000000000   # Entra ID > Overview > Tenant ID
  client_id: 00000000-0000-0000-0000-000000000000   # App registration > Application (client) ID
  client_secret: ${MS_CLIENT_SECRET}                # App registration > Certificates & secrets
  mailbox: dons@example.ch                          # the mailbox to read
  # inbox, or the name of a folder (top level or directly under Inbox)
  folder: inbox

  # For IMAP instead, replace the block above with:
  # provider: imap
  # host: imap.gmail.com        # Infomaniak: mail.infomaniak.com
  # port: 993
  # username: dons@example.ch
  # password: ${GAC_MAIL_PASSWORD}
  # folder: INBOX

  poll_seconds: 15
  # Only emails matching ALL of these filters (any entry in each list,
  # case-insensitive substring) are treated as donations. Leave a list empty
  # to disable that filter.
  # Donation notifications come from the Chaîne du Bonheur iRaiser platform:
  #   From: Chaîne du Bonheur <info@bonheur.ch>
  #   Subject: [iRaiser] notification #167 : CAC
  from_contains: ["info@bonheur.ch"]
  subject_contains: ["[iRaiser] notification"]
  body_contains: ["A Streameur-euses:"]
  # false = on the very first start, ignore emails already in the mailbox.
  process_existing: false

# How to read a donation email. Each entry is a regular expression applied to
# the subject + body text; the first (...) group is the value. A list of
# regexes means "the first one that finds something".
# Check them on a real email: save it as .eml and run
#      python -m gamersacoeur_notif parse sample.eml
#
# Expected email:
#   Montant collecté : 50 CHF        <- running total, NOT the donation amount
#   Nombre de dons : 1
#
#   Donateur: Prénom, Nom
#   Pseudo: JeanTheGamer
#   A Streameur-euses: Alice
#   Don: 50
#   Date: 2026-11-25 18:06:19 Time: 11-25 2026 - 06h06
#   Message: Courage !            (or the message on the next line)
#   Postal Address: ...
#   Email: ...
# If an email lists several donations, each "Donateur:" block becomes its
# own donation (split_on).
parsing:
  amount: '^Don:[ \t]*([^\r\n]+)'
  # Shown on stream: the pseudo only. Add '^Donateur:[ \t]*([^,\r\n]+)' to
  # the list to fall back to the first name (only if donors agreed to it).
  donor: ['^Pseudo:[ \t]*([^\r\n]+)']
  message: '^Message:[ \t]*(?:\r?\n[ \t]*)?(?!(?:Donateur|Pseudo|A Streameur-euses|Don|Date|Postal Address|Email):)([^\r\n]+)'
  # Where to look for the streamer's name. Remove this line to search the
  # whole email (subject + body).
  streamer: '^A Streameur-euses:[ \t]*([^\r\n]+)'
  currency: CHF
  default_donor: Anonyme
  split_on: '^Donateur:'

streamlabs:
  # Register an app at https://streamlabs.com/dashboard#/settings/api-settings
  # ("Register an App"), and set its redirect URI to exactly redirect_uri below.
  client_id: ${STREAMLABS_CLIENT_ID}
  client_secret: ${STREAMLABS_CLIENT_SECRET}
  redirect_uri: https://notif.example.ch/callback
  # donation = real Streamlabs donation (donation alert + recent events/goals)
  # alert    = alert box popup only, nothing recorded
  mode: donation
  # Used when mode is "alert". *text* is highlighted by Streamlabs.
  alert_message: "*{donor}* a donné *{amount} {currency}* via TWINT !"
  alert_user_message: "{message}"
  # Minimum seconds between two alerts on the same Streamlabs account.
  # Emails that arrive together are queued and played one after the other.
  min_interval_seconds: 10
  # true = log only, send nothing (good for testing the email parsing)
  dry_run: false

# --- Progress bar ----------------------------------------------------------
# Uploads progress_bar.json over FTP for the progress bar overlay page:
#   {"objective": 4000, "sl_charity": <Streamlabs Charity total>,
#    "heros_locaux": <TWINT total received by this app + offset>}
# Updated right after each donation and every interval_seconds; only
# uploaded when a value changed. Remove this section to disable it.
progress_bar:
  objective: 4000
  # Added to the TWINT total (cash donations...). Negative to remove tests.
  offset: 0
  # Streamlabs Charity team API: check the team name for this year's event.
  charity_url: https://streamlabscharity.com/api/v1/teams/@gamers-a-coeur-2026/gamers-a-coeur-2026
  interval_seconds: 30
  filename: progress_bar.json
  ftp:
    host: ftp.example.ch
    username: charity@example.ch
    password: ${FTP_PASSWORD}
    # true = FTPS (encrypted). Set false only if the server refuses it.
    tls: true
    directory: ""              # remote folder, "" = where the login lands

# --- Streamers -----------------------------------------------------------
# There is no list of streamers: anyone who opens the app's home page (see
# "python -m gamersacoeur_notif link") and logs in with Streamlabs becomes a
# streamer. Their Streamlabs / Twitch / YouTube names become their routing
# keywords. A donation is routed to the streamer whose keyword appears (whole
# word, case and accents ignored) in the "streamer" text above. Keywords can
# be edited, and streamers disabled or deleted, on /admin.
#
# Every donation ALSO goes to the main account(s). List the main account's
# Streamlabs/Twitch name here so it becomes main when it connects (or tick
# "principal" on /admin afterwards).
main_accounts: [GamersACoeur]

# true  = streamers receive alerts as soon as they connect
# false = new streamers wait until you tick "actif" on /admin
new_streamers_enabled: true
