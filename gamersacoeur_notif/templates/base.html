<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gamers à Coeur – Notifs TWINT{% endblock %}</title>
  <style>
    :root { --bg:#f6f6f8; --fg:#1b1b1f; --card:#fff; --muted:#666; --accent:#e4003a; --ok:#137333; --err:#b3261e; --line:#ddd; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141417; --fg:#eee; --card:#1f1f24; --muted:#aaa; --line:#333; --ok:#6ecf8a; --err:#f28b82; } }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin-top: 0; } h1 span { color: var(--accent); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; overflow-x:auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align: top; }
    th { font-size: 13px; color: var(--muted); font-weight: 600; }
    .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; text-decoration:none; }
    .btn.big { padding: 12px 22px; font-size: 17px; }
    .btn.ghost { background: transparent; color: var(--fg); border:1px solid var(--line); }
    form.inline { display:inline; }
    .ok { color: var(--ok); } .err { color: var(--err); } .muted { color: var(--muted); }
    .flash { padding:8px 12px; border-radius:6px; margin-bottom:12px; background:var(--card); border:1px solid var(--line); }
    code, .link { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  </style>
</head>
<body><main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main></body>
</html>
